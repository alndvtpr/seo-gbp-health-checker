<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Background Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060A12" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="40%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#E07B20" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E07B20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="75%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Linear Gradients for Cards & Borders -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="borderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07B20" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#475569" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1.5" fill="#E07B20" fill-opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#060A12"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#orangeGlow)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="630" fill="url(#techGrid)"/>

  <!-- Left Editorial Title Block -->
  <g transform="translate(80, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1E293B" stroke="#E07B20" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#E07B20"/>
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E07B20" letter-spacing="1.5">SEARCH INTELLIGENCE 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#F8FAFC" letter-spacing="-1.5">
      Is SEO Dead
    </text>
    <text x="290" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#E07B20" letter-spacing="-1.5">
      in 2026?
    </text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94A3B8">
      The Real Truth Behind AI Overviews, Zero-Click
    </text>
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94A3B8">
      Search Behavior, and Entity Authority Signals.
    </text>

    <!-- Metric Tags -->
    <g transform="translate(0, 210)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="140" height="70" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="16" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">68.01%</text>
      <text x="16" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">Zero-Click Searches</text>

      <!-- Metric 2 -->
      <rect x="155" y="0" width="140" height="70" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="171" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#10B981">~50%</text>
      <text x="171" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">AI Overviews SERP</text>

      <!-- Metric 3 -->
      <rect x="310" y="0" width="140" height="70" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="326" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#E07B20">GEO</text>
      <text x="326" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">Entity Synthesis</text>
    </g>
  </g>

  <!-- Right Visual Diagram / Futuristic Graph UI -->
  <g transform="translate(680, 100)">
    <!-- Container Card Backdrop -->
    <rect x="0" y="0" width="440" height="430" rx="24" fill="url(#cardGrad1)" stroke="url(#borderGrad1)" stroke-width="1.5"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="440" height="50" rx="24" fill="#1E293B" fill-opacity="0.6"/>
    <circle cx="30" cy="25" r="5" fill="#EF4444"/>
    <circle cx="48" cy="25" r="5" fill="#F59E0B"/>
    <circle cx="66" cy="25" r="5" fill="#10B981"/>
    <text x="100" y="30" font-family="monospace" font-size="12" fill="#94A3B8">search-ecosystem-2026.graph</text>

    <!-- Node Network Graphics -->
    <!-- Center AI Node -->
    <circle cx="220" cy="200" r="42" fill="#0F172A" stroke="#E07B20" stroke-width="2.5" filter="url(#glowEffect)"/>
    <text x="220" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" text-anchor="middle">AI SYNTHESIS</text>
    <text x="220" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#E07B20" text-anchor="middle">ENGINE</text>

    <!-- Connected Nodes -->
    <!-- Node Top: Knowledge Graph -->
    <line x1="220" y1="158" x2="220" y2="105" stroke="#E07B20" stroke-dasharray="4,4" stroke-width="1.5"/>
    <rect x="140" y="75" width="160" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="220" y="97" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Knowledge Graph &amp; E-E-A-T</text>

    <!-- Node Left: Technical SEO -->
    <line x1="178" y1="200" x2="110" y2="200" stroke="#E07B20" stroke-dasharray="4,4" stroke-width="1.5"/>
    <rect x="15" y="180" width="115" height="40" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="72" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Core Web Vitals</text>
    <text x="72" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">99/100 Speed</text>

    <!-- Node Right: Brand Mentions / Third Party -->
    <line x1="262" y1="200" x2="330" y2="200" stroke="#E07B20" stroke-dasharray="4,4" stroke-width="1.5"/>
    <rect x="310" y="180" width="115" height="40" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1"/>
    <text x="367" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#A855F7" text-anchor="middle">Search Everywhere</text>
    <text x="367" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Reddit • YouTube</text>

    <!-- Node Bottom: Structured Data / Schema -->
    <line x1="220" y1="242" x2="220" y2="300" stroke="#E07B20" stroke-dasharray="4,4" stroke-width="1.5"/>
    <rect x="140" y="295" width="160" height="34" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="220" y="317" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">Schema @graph + llms.txt</text>

    <!-- Status Footer -->
    <rect x="25" y="365" width="390" height="42" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="45" cy="386" r="4" fill="#10B981"/>
    <text x="60" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">
      Multi-Surface Search Indexing Status: <tspan fill="#10B981" font-weight="700">OPTIMIZED</tspan>
    </text>
  </g>
</svg>
