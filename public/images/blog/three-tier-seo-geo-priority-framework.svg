<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <radialGradient id="frameGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="t1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="t2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="t3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E07B20"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" rx="16" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>
  <rect width="800" height="480" rx="16" fill="url(#frameGlow)"/>

  <!-- Header Section -->
  <g transform="translate(40, 30)">
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E07B20" letter-spacing="1.5">STRATEGIC IMPLEMENTATION BLUEPRINT</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">The 3-Tier SEO &amp; GEO Priority Framework (2026)</text>
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Execute sequentially: Higher-level AI and entity optimizations require a solid technical foundation.</text>
  </g>

  <!-- Stacked Tier Cards -->
  <g transform="translate(40, 120)">
    <!-- TIER 3: AI-Ready & Generative Discovery -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="720" height="90" rx="10" fill="#131B2B" stroke="#E07B20" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="0" y="0" width="10" height="90" rx="4" fill="url(#t3Grad)"/>
      
      <!-- Tier Badge -->
      <rect x="25" y="16" width="70" height="22" rx="6" fill="#E07B20" fill-opacity="0.2" stroke="#E07B20" stroke-width="1"/>
      <text x="60" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#E07B20" text-anchor="middle">TIER 3</text>
      
      <text x="110" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">AI-Ready Content &amp; Generative Discovery (GEO)</text>
      <text x="25" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">
        Answer-first formatting • Clear factual definition blocks • Machine-readable /llms.txt endpoints • AI Share of Voice tracking
      </text>
    </g>

    <!-- Downward Connecting Indicator -->
    <g transform="translate(360, 92)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#475569" stroke-width="2" stroke-dasharray="3,3"/>
    </g>

    <!-- TIER 2: Entity Validation & Brand Authority -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="720" height="90" rx="10" fill="#131B2B" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="0" y="0" width="10" height="90" rx="4" fill="url(#t2Grad)"/>
      
      <!-- Tier Badge -->
      <rect x="25" y="16" width="70" height="22" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1"/>
      <text x="60" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" text-anchor="middle">TIER 2</text>
      
      <text x="110" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Entity Validation &amp; Cross-Platform Consensus (E-E-A-T)</text>
      <text x="25" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">
        Schema.org @graph (Person/Organization/Services) • Verified profiles • Reddit / YouTube presence • Third-party digital PR
      </text>
    </g>

    <!-- Downward Connecting Indicator -->
    <g transform="translate(360, 197)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#475569" stroke-width="2" stroke-dasharray="3,3"/>
    </g>

    <!-- TIER 1: Technical & Crawl Foundation -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="720" height="100" rx="10" fill="#131B2B" stroke="#10B981" stroke-opacity="0.5" stroke-width="2"/>
      <rect x="0" y="0" width="10" height="100" rx="4" fill="url(#t1Grad)"/>
      
      <!-- Tier Badge -->
      <rect x="25" y="16" width="70" height="22" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
      <text x="60" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="middle">TIER 1</text>
      
      <text x="110" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#10B981">Foundational Prerequisite: Technical &amp; Crawl Health</text>
      <text x="25" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">
        Crawl efficiency &amp; indexation • 99/100 Core Web Vitals (INP/LCP/CLS) • Zero main-thread blocking • Clean URL architectures
      </text>
      <text x="25" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#E07B20">
        * Critical: Failures at Tier 1 prevent Tier 2 and Tier 3 investments from driving organic growth.
      </text>
    </g>
  </g>

  <!-- Footer Note -->
  <g transform="translate(40, 455)">
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">
      Architecture: Alain Dave Tapiru Technical SEO &amp; GEO Methodology (alaintapiru.com)
    </text>
  </g>
</svg>
